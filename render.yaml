services:
  - type: web
    name: dhan
    runtime: docker
    plan: free
    healthCheckPath: /api/v1/health
    envVars:
      - key: MONGODB_URI
        sync: false
      - key: MONGODB_DB
        value: dhan
      - key: JWT_SECRET
        generateValue: true
      - key: GROQ_API_KEY
        sync: false
